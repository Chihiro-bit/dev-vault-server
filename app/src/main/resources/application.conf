# DevVault 服务端配置。所有项都可以用环境变量覆盖（见 ${?VAR}）
ktor {
  deployment {
    host = "0.0.0.0"
    host = ${?DEVVAULT_HOST}
    port = 8080
    port = ${?DEVVAULT_PORT}
  }
  application {
    modules = [com.devvault.server.app.ApplicationKt.module]
  }
}

devvault {
  # 显示在客户端的服务器名称
  name = "DevVault"
  name = ${?DEVVAULT_NAME}

  # 是否开放注册。自建私有服务器可在创建完账号后关闭
  allowRegistration = true
  allowRegistration = ${?DEVVAULT_ALLOW_REGISTRATION}

  # 登录有效期（天），期间有访问会自动续期
  sessionDays = 30
  sessionDays = ${?DEVVAULT_SESSION_DAYS}

  # 部署在 Nginx 等反向代理之后时设为 true，以从 X-Forwarded-For 读取真实 IP（用于登录限流）
  trustProxy = false
  trustProxy = ${?DEVVAULT_TRUST_PROXY}

  db {
    url = "jdbc:mysql://127.0.0.1:3306/devvault?useUnicode=true&characterEncoding=utf8&serverTimezone=UTC"
    url = ${?DEVVAULT_DB_URL}
    user = "devvault"
    user = ${?DEVVAULT_DB_USER}
    password = ""
    password = ${?DEVVAULT_DB_PASSWORD}
    poolSize = 10
    poolSize = ${?DEVVAULT_DB_POOL_SIZE}
  }
}
